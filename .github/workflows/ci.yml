name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static:
    name: verify-static
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Run timezone process matrix
        run: pnpm test:tz

  verify-mobile-static:
    name: verify-mobile-static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo dependency compatibility
        run: pnpm --filter @cadence/mobile dependencies:check

      - name: Run shared planner tests
        run: pnpm test:shared-planner

      - name: Typecheck mobile app
        run: pnpm --filter @cadence/mobile typecheck

  verify-pr-db:
    name: verify-pr-db
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable Mailpit in CI Supabase config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config_path = Path("supabase/config.toml")
          config = config_path.read_text()
          if "[inbucket]\nenabled = true" in config:
              config = config.replace(
                  "[inbucket]\nenabled = true",
                  "[inbucket]\nenabled = false",
                  1,
              )
          elif "[inbucket]\nenabled = false" not in config:
              raise SystemExit("Could not locate [inbucket] enabled setting in supabase/config.toml")
          config_path.write_text(config)
          PY

      - name: Stop stale Supabase containers
        run: pnpm exec supabase stop --all || true

      - name: Start local Supabase (lean profile)
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDE="studio,mailpit,imgproxy,analytics,vector,edge-runtime,postgres-meta,logflare,supavisor"
          MAX_ATTEMPTS=4
          BACKOFFS=(5 15 30)
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Starting Supabase (attempt ${attempt}/${MAX_ATTEMPTS})..."
            if pnpm supabase:start -- --exclude "$EXCLUDE"; then
              echo "Supabase started successfully on attempt ${attempt}."
              exit 0
            fi
            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              echo "Supabase failed to start after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi
            echo "Supabase start failed; stopping containers before retry..."
            pnpm exec supabase stop --all || true
            sleep "${BACKOFFS[$((attempt - 1))]}"
          done

      - name: Reset and seed local database
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDE="studio,mailpit,imgproxy,analytics,vector,edge-runtime,postgres-meta,logflare,supavisor"
          MAX_ATTEMPTS=3
          BACKOFFS=(5 15)
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Resetting Supabase database (attempt ${attempt}/${MAX_ATTEMPTS})..."
            if pnpm supabase:reset; then
              echo "Supabase database reset succeeded on attempt ${attempt}."
              exit 0
            fi
            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              echo "Supabase database reset failed after ${MAX_ATTEMPTS} attempts."
              echo "Running supabase db reset --debug for diagnostics..."
              pnpm exec supabase db reset --debug
              exit $?
            fi
            echo "Supabase database reset failed; restarting containers before retry..."
            pnpm exec supabase stop --all || true
            pnpm supabase:start -- --exclude "$EXCLUDE"
            sleep "${BACKOFFS[$((attempt - 1))]}"
          done

      - name: Lint and advise local database
        run: |
          pnpm exec supabase db lint --local --schema public,private --level warning --fail-on error
          pnpm exec supabase db advisors --local --type all --level warn --fail-on error

      - name: Check generated database types
        run: |
          pnpm types:supabase
          git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            --override-name db.url=SUPABASE_DB_URL)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}"
            echo "SUPABASE_DB_URL=${SUPABASE_DB_URL}"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
          } >> "${GITHUB_ENV}"

      - name: Run automated SQL smoke tests
        run: pnpm test:sql

      - name: Run two-session concurrency harness
        run: pnpm test:concurrency

  verify-pr-e2e:
    name: verify-pr-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable Mailpit in CI Supabase config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config_path = Path("supabase/config.toml")
          config = config_path.read_text()
          if "[inbucket]\nenabled = true" in config:
              config = config.replace(
                  "[inbucket]\nenabled = true",
                  "[inbucket]\nenabled = false",
                  1,
              )
          elif "[inbucket]\nenabled = false" not in config:
              raise SystemExit("Could not locate [inbucket] enabled setting in supabase/config.toml")
          config_path.write_text(config)
          PY

      - name: Stop stale Supabase containers
        run: pnpm exec supabase stop --all || true

      - name: Start local Supabase (lean profile)
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDE="studio,mailpit,imgproxy,analytics,vector,edge-runtime,postgres-meta,logflare,supavisor"
          MAX_ATTEMPTS=4
          BACKOFFS=(5 15 30)
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Starting Supabase (attempt ${attempt}/${MAX_ATTEMPTS})..."
            if pnpm supabase:start -- --exclude "$EXCLUDE"; then
              echo "Supabase started successfully on attempt ${attempt}."
              exit 0
            fi
            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              echo "Supabase failed to start after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi
            echo "Supabase start failed; stopping containers before retry..."
            pnpm exec supabase stop --all || true
            sleep "${BACKOFFS[$((attempt - 1))]}"
          done

      - name: Reset and seed local database
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDE="studio,mailpit,imgproxy,analytics,vector,edge-runtime,postgres-meta,logflare,supavisor"
          MAX_ATTEMPTS=3
          BACKOFFS=(5 15)
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Resetting Supabase database (attempt ${attempt}/${MAX_ATTEMPTS})..."
            if pnpm supabase:reset; then
              echo "Supabase database reset succeeded on attempt ${attempt}."
              exit 0
            fi
            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              echo "Supabase database reset failed after ${MAX_ATTEMPTS} attempts."
              echo "Running supabase db reset --debug for diagnostics..."
              pnpm exec supabase db reset --debug
              exit $?
            fi
            echo "Supabase database reset failed; restarting containers before retry..."
            pnpm exec supabase stop --all || true
            pnpm supabase:start -- --exclude "$EXCLUDE"
            sleep "${BACKOFFS[$((attempt - 1))]}"
          done

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            --override-name db.url=SUPABASE_DB_URL)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}"
            echo "SUPABASE_DB_URL=${SUPABASE_DB_URL}"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
          } >> "${GITHUB_ENV}"

      - name: Build production application
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium + API E2E smoke
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_PORT="$(
          python3 - <<'PY'
          import socket

          for port in range(3100, 3200):
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                  try:
                      sock.bind(("127.0.0.1", port))
                  except OSError:
                      continue
                  print(port)
                  break
          else:
              raise SystemExit(1)
          PY
          )"

          if [[ -z "${PLAYWRIGHT_PORT}" ]]; then
            echo "Unable to reserve a Playwright port in range 3100-3199." >&2
            exit 1
          fi

          export PLAYWRIGHT_PORT
          export NEXT_PUBLIC_APP_URL="http://localhost:${PLAYWRIGHT_PORT}"
          echo "Running Playwright against ${NEXT_PUBLIC_APP_URL}."
          pnpm test:e2e:chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Keep this exact job name for GitHub required-check compatibility.
  verify-pr-smoke:
    name: verify-pr-smoke
    if: always()
    needs:
      - verify-pr-db
      - verify-pr-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Assert PR smoke jobs passed
        run: |
          if [[ "${{ needs.verify-pr-db.result }}" != "success" || "${{ needs.verify-pr-e2e.result }}" != "success" ]]; then
            echo "verify-pr-db result: ${{ needs.verify-pr-db.result }}"
            echo "verify-pr-e2e result: ${{ needs.verify-pr-e2e.result }}"
            exit 1
          fi

  verify:
    name: verify
    if: always()
    needs:
      - verify-static
      - verify-mobile-static
      - verify-pr-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Assert all verify jobs passed
        run: |
          if [[ "${{ needs.verify-static.result }}" != "success" || "${{ needs.verify-mobile-static.result }}" != "success" || "${{ needs.verify-pr-smoke.result }}" != "success" ]]; then
            echo "verify-static result: ${{ needs.verify-static.result }}"
            echo "verify-mobile-static result: ${{ needs.verify-mobile-static.result }}"
            echo "verify-pr-smoke result: ${{ needs.verify-pr-smoke.result }}"
            exit 1
          fi
