name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static:
    name: verify-static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

  verify-pr-smoke:
    name: verify-pr-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable Mailpit in CI Supabase config
        run: |
          python - <<'PY'
          from pathlib import Path

          config_path = Path("supabase/config.toml")
          config = config_path.read_text()
          if "[inbucket]\nenabled = true" in config:
              config = config.replace(
                  "[inbucket]\nenabled = true",
                  "[inbucket]\nenabled = false",
                  1,
              )
          elif "[inbucket]\nenabled = false" not in config:
              raise SystemExit("Could not locate [inbucket] enabled setting in supabase/config.toml")
          config_path.write_text(config)
          PY

      - name: Start local Supabase (lean profile)
        run: pnpm supabase:start -- --exclude studio,mailpit,imgproxy,analytics,vector,edge-runtime,postgres-meta,logflare,supavisor

      - name: Reset and seed local database
        run: pnpm supabase:reset

      - name: Check generated database types
        run: |
          pnpm types:supabase
          git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            --override-name db.url=SUPABASE_DB_URL)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}"
            echo "SUPABASE_DB_URL=${SUPABASE_DB_URL}"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
          } >> "${GITHUB_ENV}"

      - name: Run automated SQL smoke tests
        run: pnpm test:sql

      - name: Build production application
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium + API E2E smoke
        run: pnpm test:e2e:chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: verify
    if: always()
    needs:
      - verify-static
      - verify-pr-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Assert all verify jobs passed
        run: |
          if [[ "${{ needs.verify-static.result }}" != "success" || "${{ needs.verify-pr-smoke.result }}" != "success" ]]; then
            echo "verify-static result: ${{ needs.verify-static.result }}"
            echo "verify-pr-smoke result: ${{ needs.verify-pr-smoke.result }}"
            exit 1
          fi
