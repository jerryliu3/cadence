name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated planner contracts
        run: pnpm contracts:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit, contract, telemetry, and benchmark tests
        run: pnpm test

      - name: Run isolated planner performance gate
        run: pnpm test:benchmark

      - name: Run timezone process matrix
        run: pnpm test:tz

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Reset and seed local database
        run: pnpm supabase:reset

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            --override-name db.url=SUPABASE_DB_URL)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}"
            echo "SUPABASE_DB_URL=${SUPABASE_DB_URL}"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
          } >> "${GITHUB_ENV}"

      - name: Run automated SQL tests
        run: pnpm test:sql

      - name: Run two-session concurrency harness
        run: pnpm test:concurrency

      - name: Build production application
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Chromium, WebKit, mobile, and API E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
