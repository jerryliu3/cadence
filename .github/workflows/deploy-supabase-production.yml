name: Deploy Supabase Migrations (Production)

on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-prod-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: deploy-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate required Supabase secrets
        shell: bash
        run: |
          for secret_name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::$secret_name is not configured."
              exit 1
            fi
          done

      - name: Link production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply production database migrations
        run: supabase db push --linked --include-all --yes

      - name: Print migration status
        run: supabase migration list --linked
