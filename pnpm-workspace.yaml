packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@sentry/cli': false
  esbuild: true
  msw: true
  react-native-nitro-modules: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@54.0.27'
  - expo-constants@18.0.14
  - expo-file-system@19.0.24
  - expo-modules-autolinking@3.0.27
  - expo-updates@29.0.20
  - expo@54.0.37
